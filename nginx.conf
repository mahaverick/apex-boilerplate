# The container's only server block, as a template. The Dockerfile copies it to
# /etc/nginx/templates/default.conf.template and the image's entrypoint renders
# it with envsubst into /tmp/nginx/conf.d/default.conf on every start, so the
# root filesystem can stay read-only.
#
# Only API_UPSTREAM is substituted, because NGINX_ENVSUBST_FILTER in the
# Dockerfile limits envsubst to that one name. A new placeholder needs the filter
# widened too: otherwise it reaches nginx unrendered, nginx reads `${NAME}` as
# one of its own variables, and `nginx -t` fails with `unknown "NAME" variable`.
#
# docker/nginx.main.conf includes the rendered file inside `http { }`, so
# `log_format` and `map` are legal at the top of this file and `server` sits
# directly in `http`.

# Logs `$uri` instead of the request line, so the query string never reaches the
# log. Applied at server level below; the `access_log` comment says why.
log_format stream_nolog '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';

# The cache policy, chosen by URI here and not by a per-location `add_header`.
#
# `add_header` does not inherit into a location block that declares any
# `add_header` of its own. A `location /assets/` setting Cache-Control would
# therefore drop every security header set on the server block, on exactly the
# responses a browser caches longest, and `nginx -t` would still pass. So no
# location in this file declares an `add_header`: the value is computed here and
# a single `add_header Cache-Control` sits on the server block with the rest.
# Check the result with `curl -I` on a real asset.
#
# An empty value makes nginx skip the header. That keeps a proxied /api/ response
# on the backend's own Cache-Control instead of a second, contradictory one.
map $uri $cache_control {
  default         '';
  ~^/assets/      'public, max-age=31536000, immutable';
  /index.html     'no-store';
  /theme-init.js  'no-store';
  /boot-variant.js 'no-store';
  /favicon.svg    'no-store';
  # Written at container start from the environment, so it changes without the
  # bundle changing.
  /runtime-config.js 'no-store';
}

# Each security header below is sent only when the response does not already
# carry its own. A proxied /api/ response carries express's (helmet's
# `X-Frame-Options: SAMEORIGIN`, a `default-src 'none'` CSP and the rest), and
# adding this file's as well would send two of each: two
# `Cross-Origin-Opener-Policy` lines do not parse, so COOP falls back to
# `unsafe-none`. The key is the upstream's own header, not `/api/`, so nginx's
# own 502 or 504 for an /api/ request still carries the full set. An EMPTY value
# skips the header (see the cache map). `proxy_hide_header` would instead
# replace helmet's stricter API values with this file's page values.
map $upstream_http_referrer_policy $referrer_policy {
  ''      'no-referrer';
  default '';
}
map $upstream_http_x_content_type_options $x_content_type_options {
  ''      'nosniff';
  default '';
}
map $upstream_http_x_frame_options $x_frame_options {
  ''      'DENY';
  default '';
}
map $upstream_http_cross_origin_opener_policy $cross_origin_opener_policy {
  ''      'same-origin';
  default '';
}
map $upstream_http_permissions_policy $permissions_policy {
  ''      'camera=(), microphone=(), geolocation=(), payment=(), usb=()';
  default '';
}
# script-src 'self' holds because no script is inline: the pre-paint scripts
# are the files /theme-init.js and /boot-variant.js. style-src needs
# 'unsafe-inline' because the chart wrapper's ChartStyle
# (src/components/ui/chart.tsx), Base UI's Select popup and its ScrollArea (the
# command palette) render <style> elements, and index.html's boot shell is
# inline CSS.
# connect-src 'self' holds because /api is proxied on the same origin.
map $upstream_http_content_security_policy $content_security_policy {
  ''      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
  default '';
}

# TLS terminates in front of this container, which listens on :8080 only, so
# `$scheme` is always "http". The terminator's X-Forwarded-Proto is passed on
# when it is "http" or "https" in any case; any other value falls back to `$scheme`.
# Forwarding a client-suppliable header is safe only while express makes no URL
# or HTTPS decision from `req.protocol` or `req.secure` beyond express-session's
# Secure cookie check.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
  http    http;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Drops the version from the `Server` header and from error pages.
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The query-stripping format is set at server level, not per location, because
  # `access_log` in a location applies only once a location is selected, and a
  # request rejected earlier (a 505 for a bad protocol version, a 414 for an
  # over-long URI) would be logged under the http-level `main` format with its
  # query string intact.
  #
  # It is a real protection and not only defence in depth: `location /` serves
  # index.html for every SPA route, including `/reset-password?token=` and
  # `/verify-email?token=`, whose tokens are one-time credentials mailed to
  # users. The cost is that no request's query string is logged anywhere.
  access_log /var/log/nginx/access.log stream_nolog;

  # `always` sets the security headers on error responses too, not only on
  # 2xx/3xx. The cache map says why they live only here, and the security-header
  # maps say why a proxied response keeps its own.
  add_header Referrer-Policy $referrer_policy always;
  add_header X-Content-Type-Options $x_content_type_options always;
  add_header X-Frame-Options $x_frame_options always;
  add_header Cross-Origin-Opener-Policy $cross_origin_opener_policy always;
  add_header Permissions-Policy $permissions_policy always;
  add_header Content-Security-Policy $content_security_policy always;
  # Not `always`: an error response must never carry the year-long immutable
  # policy of the asset URI it failed to serve.
  add_header Cache-Control $cache_control;
  # No HSTS here: whether TLS fronts this container, and which hosts the policy
  # covers, is the TLS edge's to decide. Set it there.

  # Google's redirect lands here with `code` and `state` in the query string, and
  # nginx writes the whole request line into every upstream error message, at the
  # `error` level. `crit` silences those messages for this route only: the reason
  # for an upstream failure here is in express's logs. The other directives are
  # `location /api/`'s; change both together (tests/unit/docker/nginx-conf.test.ts
  # compares them). docker/check-image.sh proves the callback's query stays out of
  # the log while another /api/ path still logs its error.
  #
  # A regex, not `=`: express routes without strict slashes and ignores case, so
  # `/callback/` and `/Api/V1/Auth/Google/Callback` reach the same handler and
  # must not log either. A regex location is tried after the longest prefix
  # match and wins over it unless that prefix is `^~`; `location /api/` is not,
  # so making it `^~` would silently disable this location. `~*` also matches an
  # uppercase `/API/`, which this location proxies where `location /` would serve
  # index.html; express answers it as the callback anyway.
  location ~* ^/api/v1/auth/google/callback/?$ {
    error_log /var/log/nginx/error.log crit;
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /api/ {
    # No path on proxy_pass or in API_UPSTREAM, not even a bare "/": a path makes
    # nginx rewrite the URI (`/api/` becomes that path), so express stops
    # matching its routes.
    #
    # An upstream error here logs the request line, query string included; the
    # Google OAuth callback has its own location above to keep its query out.
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The terminator's X-Forwarded-Proto (see the map above). express needs
    # TRUST_PROXY set for express-session to see HTTPS through it and set the
    # Secure `oauth.sid` cookie.
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # posthog-js's events, session replay and recorder script, which express's
  # analytics proxy forwards to PostHog; the browser never talks to PostHog
  # itself, so `connect-src 'self'` and `script-src 'self'` hold. The only
  # differences from `location /api/` concern the request body. nginx's default
  # 1 MB answers 413 to a replay batch, which posthog-js splits only above about
  # 6.3 MiB (6606028 bytes), and base64 (`data=`, used when gzip is unavailable)
  # adds a third: 10 MB covers that. The body streams to express as it arrives
  # instead of being buffered under /tmp, as express streams it on to PostHog.
  # The query string holds transport parameters such as `compression`, and the
  # server-level format strips it anyway.
  location /api/v1/collect/ {
    client_max_body_size 10m;
    proxy_request_buffering off;
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # The run-time configuration docker/10-runtime-config.sh writes at start; it
  # lives under /tmp because the root filesystem is read-only. index.html loads
  # it before the bundle. Same-origin, so `script-src 'self'` covers it, and its
  # Cache-Control comes from the cache map.
  location = /runtime-config.js {
    alias /tmp/runtime/runtime-config.js;
  }

  # A missing hashed asset is a real 404, not index.html with a 200: a page asking
  # for a chunk a deploy removed then fails at the request instead of parsing HTML
  # as JavaScript.
  location /assets/ {
    try_files $uri =404;
  }

  # The image build deletes its source maps; this keeps one from being served
  # if a deploy ever copies dist/ without that step. A regex location is tried
  # after the longest prefix match and wins over it unless that prefix is `^~`.
  # `/assets/` is not, so /assets/x.js.map is a 404 here even when the file
  # exists. /api/ is excluded so a proxied path ending in .map is still the
  # API's to answer.
  location ~* ^(?!/api/).+\.map$ {
    return 404;
  }

  location / {
    # The SPA fallback. After the internal redirect `$uri` is /index.html, so the
    # cache map gives every client-side route `no-store`: a cached index.html is
    # how a deploy leaves browsers requesting asset hashes that no longer exist.
    try_files $uri /index.html;
  }
}
